<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Nimbus - project tracking for small teams</title>
<style>
  :root { --ink:#0f1220; --muted:#5b6178; --accent:#4f5bd5; --bg:#fbfbfe; }
  * { box-sizing: border-box; }
  body { margin:0; font-family:-apple-system,Segoe UI,Roboto,sans-serif; background:var(--bg); color:var(--ink); }
  header { display:flex; align-items:center; justify-content:space-between; padding:20px 48px; border-bottom:1px solid #eceefb; }
  .logo { font-weight:800; font-size:20px; }
  .logo span { color:var(--accent); }
  nav a { margin-left:28px; color:var(--muted); text-decoration:none; font-size:14px; }
  main { max-width:720px; margin:0 auto; padding:96px 24px 120px; text-align:center; }
  h1 { font-size:44px; line-height:1.15; margin:0 0 16px; letter-spacing:-0.02em; }
  p.sub { color:var(--muted); font-size:18px; margin:0 0 36px; }
  .cta {
    display:inline-block;
    background: var(--accent);
    color:#fff;
    font-weight:600;
    font-size:15px;
    padding:12px 24px;
    border-radius:8px;
    text-decoration:none;
  }
  footer { text-align:center; padding:32px; color:var(--muted); font-size:13px; }
</style>
</head>
<body>
  <header>
    <div class="logo">nimbus<span>.</span></div>
    <nav>
      <a href="#">Product</a>
      <a href="#">Pricing</a>
      <a href="#">Docs</a>
    </nav>
  </header>
  <main>
    <h1>Ship projects your whole team can actually see</h1>
    <p class="sub">Nimbus is the lightweight project tracker for teams who outgrew a spreadsheet but don't need another enterprise suite.</p>
    <a class="cta" href="#">Start for free</a>
  </main>
  <footer>© 2026 Nimbus, Inc.</footer>
</body>
</html>
