name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# A half-published release is worse than a queued one - never cancel a
# release run for a newer tag push.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diffboard/core run build
      - run: pnpm --filter diffboard run build

      - name: Resolve version from tag
        id: version
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Extract release notes from CHANGELOG.md
        run: ./scripts/release_notes.sh "${{ steps.version.outputs.version }}" > /tmp/release-notes.md

      - name: Publish diffboard CLI to npm
        working-directory: packages/cli
        run: |
          npm pkg set version="${{ steps.version.outputs.version }}"
          pnpm publish --access public --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release-notes.md
          generate_release_notes: false
