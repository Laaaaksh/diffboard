name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diffboard/core run build
      - run: pnpm --filter @diffboard/core run lint
      - run: pnpm --filter @diffboard/server run lint
      - run: pnpm --filter diffboard run lint

  test-core:
    name: Test (core)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diffboard/core run test

  test-server:
    name: Test (server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: diffboard
          POSTGRES_PASSWORD: diffboard
          POSTGRES_DB: diffboard_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diffboard"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://diffboard:diffboard@localhost:5432/diffboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diffboard/core run build
      - run: pnpm --filter @diffboard/server exec prisma migrate deploy
      - run: pnpm --filter @diffboard/server run prisma:generate
      - run: pnpm --filter @diffboard/server run test

  test-cli:
    name: Test (cli)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @diffboard/core run build
      - run: pnpm --filter diffboard exec playwright install --with-deps chromium
      - run: pnpm --filter diffboard run test

  docker-build:
    name: Docker build (server)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/server/Dockerfile
          push: false
